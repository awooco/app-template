name: "builder"

on:
  push:
    branches: [ "main" ]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux and Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install --upgrade pip
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed main.py

      - name: Compress Build Output
        run: |
          tar -czvf app-linux-x86_64.tar.gz -C dist/ main

      - name: Release and Update Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Development Build"
          body: "Automated build triggered by push to main branch."
          draft: false
          prerelease: true
          files: app-linux-x86_64.tar.gz