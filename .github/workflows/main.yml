name: "builder"

on:
  push:
    branches: [ "main" ]


env:
  APP_NAME: "catos"
  SCRIPT_NAME: "installer.py"
  DEB_PKG_NAME: "catos"
  DISPLAY_NAME: "catos" 

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux and Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk wget
          pip install --upgrade pip
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          # The --name flag ensures the output matches your $APP_NAME variable
          pyinstaller --noconfirm --onefile --windowed --name "$APP_NAME" "$SCRIPT_NAME"
          
      - name: Package as .deb
        run: |
          mkdir -p debian_package/usr/bin
          mkdir -p debian_package/DEBIAN
          
          cp "dist/$APP_NAME" debian_package/usr/bin/
          
          cat <<EOF > debian_package/DEBIAN/control
          Package: $DEB_PKG_NAME
          Version: 1.0.0
          Section: base
          Priority: optional
          Architecture: amd64
          Maintainer: Builder <builder@example.com>
          Description: A Python application built with PyInstaller.
          EOF
          
          # This creates a file like "my-python-app-linux-x86_64.deb"
          dpkg-deb --build debian_package "${DEB_PKG_NAME}-linux-x86_64.deb"

      - name: Package as .AppImage
        run: |
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          
          mkdir -p AppDir/usr/bin
          cp "dist/$APP_NAME" AppDir/usr/bin/
          
          cat <<EOF > "AppDir/${APP_NAME}.desktop"
          [Desktop Entry]
          Name=$DISPLAY_NAME
          Exec=$APP_NAME
          Icon=$APP_NAME
          Type=Application
          Categories=Utility;
          EOF
          
          cat <<EOF > "AppDir/${APP_NAME}.svg"
          <svg width="64" height="64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" fill="blue"/></svg>
          EOF
          
          # Notice the \$ escapes here. This prevents GitHub from evaluating 
          # those specific variables, allowing the script to write them properly.
          cat <<EOF > AppDir/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\${HERE}/usr/bin/$APP_NAME" "\$@"
          EOF
          chmod +x AppDir/AppRun
          
          export APPIMAGE_EXTRACT_AND_RUN=1
          
          # This creates a file like "installer-linux-x86_64.AppImage"
          ./appimagetool AppDir "${APP_NAME}-linux-x86_64.AppImage"

      - name: Release and Update Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Development Build"
          body: "Automated build triggered by push to main branch."
          draft: false
          prerelease: true
          files: |
            *.deb
            *.AppImage
